<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">검증된 도구와 저장소 가시성 게이트</title><desc id="desc">취약점 목록이 대응 브리프로 바뀌고 공개 범위 확인에서 출고가 멈추는 작업 흐름</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17384a"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#59d2c2"/><stop offset="1" stop-color="#f1bd64"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><g opacity=".16" stroke="#a2c9da"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M160 0V900M400 0V900M640 0V900M880 0V900M1120 0V900M1360 0V900"/></g>
<text x="115" y="130" fill="#dcebf3" font-family="sans-serif" font-size="31" letter-spacing="4">A RELEASE NEEDS THE RIGHT DESTINATION</text><text x="115" y="182" fill="#86a9bc" font-family="sans-serif" font-size="22">검증된 산출물도 저장소의 가시성이 맞아야 출고가 된다</text>
<path d="M190 445H540M690 445H1050" stroke="url(#line)" stroke-width="14" stroke-linecap="round" filter="url(#g)"/><path d="M1115 445H1410" stroke="#9a5461" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 16"/>
<g fill="#0d283b" stroke="#72d6ca" stroke-width="3"><rect x="100" y="355" width="225" height="180" rx="22"/><rect x="460" y="355" width="270" height="180" rx="22"/><rect x="915" y="335" width="300" height="220" rx="22"/></g>
<g font-family="sans-serif"><text x="145" y="425" fill="#dcebf3" font-size="29">외부 목록</text><text x="145" y="470" fill="#93b4c7" font-size="20">실제 악용 취약점</text><text x="515" y="425" fill="#dcebf3" font-size="29">대응 브리프</text><text x="505" y="470" fill="#93b4c7" font-size="20">필터 · 점검 순서</text><text x="970" y="408" fill="#f2c66e" font-size="28">가시성 확인</text><text x="960" y="450" fill="#dcebf3" font-size="21">의도: 비공개 보관</text><text x="960" y="490" fill="#f29a9c" font-size="21">실제: 공개 상태</text></g>
<circle cx="1305" cy="445" r="63" fill="#482333" stroke="#f0868e" stroke-width="5"/><path d="M1273 413l64 64m0-64l-64 64" stroke="#f6bdc0" stroke-width="10" stroke-linecap="round"/><text x="1220" y="570" fill="#f0b3b6" font-family="sans-serif" font-size="24">출고 중단</text>
<g><rect x="185" y="650" width="1230" height="96" rx="18" fill="#112f42" stroke="#3d7087"/><text x="245" y="708" fill="#b8d3df" font-family="sans-serif" font-size="26">테스트 통과 ≠ 공개 범위 승인  ·  내용의 안전성 + 도착지의 가시성을 함께 확인한다</text></g>
</svg>