<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F0E8D6" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.25" fill="#F0E8D6" fill-opacity=".11"/>
    </pattern>
    <pattern id="paperLines" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 2H12M0 8H12" stroke="#F0E8D6" stroke-opacity=".07" stroke-width=".7"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="pathFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0E8D6" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#6D87BE" stop-opacity=".75"/>
      <stop offset="1" stop-color="#F0E8D6" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="signalWash" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6D87BE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6D87BE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inquiryClip">
      <rect x="640" y="257" width="330" height="386" rx="165"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#202324"/>
  <rect x="72" y="58" width="1456" height="784" rx="2" fill="none" stroke="#F0E8D6" stroke-opacity=".08"/>
  <path d="M72 146H1528M72 754H1528" stroke="#F0E8D6" stroke-opacity=".055"/>
  <rect x="72" y="58" width="1456" height="784" fill="url(#microGrid)" opacity=".62"/>

  <!-- A quiet document margin and registration details -->
  <g fill="#F0E8D6" fill-opacity=".25">
    <rect x="105" y="110" width="34" height="2"/>
    <rect x="105" y="118" width="18" height="2"/>
    <rect x="1461" y="781" width="34" height="2"/>
    <rect x="1477" y="789" width="18" height="2"/>
  </g>
  <g stroke="#F0E8D6" stroke-opacity=".16" fill="none">
    <path d="M105 174v-18h18M1495 726v18h-18"/>
    <path d="M800 72v12M800 816v12"/>
  </g>

  <!-- The connecting course: uncertain, contained, then exact -->
  <path d="M300 483C425 405 522 525 645 462S853 383 970 450s190 66 324-17" fill="none" stroke="#111415" stroke-width="16" stroke-linecap="round" opacity=".7"/>
  <path d="M300 483C425 405 522 525 645 462S853 383 970 450s190 66 324-17" fill="none" stroke="url(#pathFade)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M300 483C425 405 522 525 645 462S853 383 970 450s190 66 324-17" fill="none" stroke="#F0E8D6" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 17" stroke-linecap="round"/>

  <!-- Unknown signal: incomplete arcs, drifting marks, and a soft field -->
  <circle cx="330" cy="455" r="174" fill="url(#signalWash)"/>
  <circle cx="330" cy="455" r="85" fill="#6D87BE" fill-opacity=".06" filter="url(#softGlow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M236 466a98 98 0 0 1 145-85" stroke="#F0E8D6" stroke-opacity=".58" stroke-width="3" stroke-dasharray="41 18 7 27"/>
    <path d="M411 435a98 98 0 0 1-82 118" stroke="#6D87BE" stroke-opacity=".85" stroke-width="3" stroke-dasharray="54 21"/>
    <path d="M270 426c22-28 61-39 93-22 23 12 38 39 34 65" stroke="#F0E8D6" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 10"/>
  </g>
  <g fill="#F0E8D6">
    <circle cx="264" cy="389" r="3" fill-opacity=".78"/>
    <circle cx="311" cy="363" r="2" fill-opacity=".34"/>
    <circle cx="396" cy="401" r="4" fill-opacity=".5"/>
    <circle cx="242" cy="501" r="2.5" fill-opacity=".28"/>
    <circle cx="354" cy="535" r="3" fill-opacity=".72"/>
    <circle cx="424" cy="490" r="2" fill-opacity=".4"/>
  </g>
  <path d="M307 447l18-11 21 10 7 22-15 17-24-2-12-18z" fill="#6D87BE" fill-opacity=".26" stroke="#F0E8D6" stroke-opacity=".42"/>
  <circle cx="329" cy="460" r="5" fill="#F0E8D6"/>

  <!-- Bounded inquiry: an open capsule containing ordered evidence -->
  <rect x="640" y="257" width="330" height="386" rx="165" fill="#171A1B" fill-opacity=".64" stroke="#F0E8D6" stroke-opacity=".5" stroke-width="1.5"/>
  <rect x="660" y="277" width="290" height="346" rx="145" fill="url(#paperLines)"/>
  <g clip-path="url(#inquiryClip)">
    <path d="M617 542c81-18 117-116 192-112 70 4 98 104 182 76" fill="none" stroke="#6D87BE" stroke-opacity=".7" stroke-width="45"/>
    <path d="M617 542c81-18 117-116 192-112 70 4 98 104 182 76" fill="none" stroke="#F0E8D6" stroke-opacity=".75" stroke-width="2"/>
    <path d="M621 588c92-23 129-105 205-99 59 5 93 67 156 62" fill="none" stroke="#F0E8D6" stroke-opacity=".18" stroke-width="1" stroke-dasharray="5 9"/>
  </g>
  <g stroke="#F0E8D6" stroke-opacity=".62" fill="#202324">
    <circle cx="690" cy="511" r="7"/>
    <circle cx="804" cy="431" r="7"/>
    <circle cx="916" cy="493" r="7"/>
  </g>
  <path d="M805 297v34M805 569v34" stroke="#F0E8D6" stroke-opacity=".42"/>
  <path d="M788 314h34M788 586h34" stroke="#F0E8D6" stroke-opacity=".18"/>
  <circle cx="805" cy="450" r="116" fill="none" stroke="#6D87BE" stroke-opacity=".18" stroke-dasharray="1 12" stroke-linecap="round"/>

  <!-- Verified checkpoint: stable geometry with a luminous registration point -->
  <g transform="translate(1288 433)">
    <circle r="120" fill="#171A1B" stroke="#F0E8D6" stroke-opacity=".16"/>
    <circle r="89" fill="none" stroke="#6D87BE" stroke-opacity=".32" stroke-width="22" stroke-dasharray="90 22" transform="rotate(-18)"/>
    <circle r="66" fill="none" stroke="#F0E8D6" stroke-opacity=".7" stroke-width="2"/>
    <path d="M-44 0H44M0-44V44" stroke="#F0E8D6" stroke-opacity=".22"/>
    <path d="M-16 1l11 12 25-29" fill="none" stroke="#F0E8D6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="9" fill="#F0E8D6" fill-opacity=".25" filter="url(#smallGlow)"/>
    <circle r="4" fill="#F0E8D6"/>
  </g>
  <g stroke="#F0E8D6" stroke-opacity=".35">
    <path d="M1288 281v20M1288 565v20M1136 433h20M1420 433h20"/>
    <path d="M1181 326l14 14M1381 526l14 14M1395 326l-14 14M1195 526l-14 14" stroke-opacity=".15"/>
  </g>

  <!-- Sparse editorial ledger marks tie the three states together -->
  <g fill="#F0E8D6" fill-opacity=".13">
    <rect x="211" y="690" width="128" height="2"/>
    <rect x="211" y="704" width="77" height="2"/>
    <rect x="744" y="703" width="122" height="2"/>
    <rect x="770" y="717" width="96" height="2"/>
    <rect x="1237" y="678" width="103" height="2"/>
    <rect x="1237" y="692" width="62" height="2"/>
  </g>
  <g fill="#6D87BE">
    <circle cx="211" cy="675" r="3" fill-opacity=".75"/>
    <circle cx="744" cy="688" r="3" fill-opacity=".75"/>
    <circle cx="1237" cy="663" r="3" fill-opacity=".75"/>
  </g>
</svg>
