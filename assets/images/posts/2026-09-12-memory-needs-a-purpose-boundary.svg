<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">기억의 목적과 경계</title><desc id="desc">대화에서 나온 정보가 필요한 선호, 검토할 맥락, 남기지 않을 원문으로 나뉘고 목적과 만료 경계를 거치는 도해</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162c"/><stop offset="1" stop-color="#20375a"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter></defs>
<rect width="1600" height="840" fill="url(#bg)"/><circle cx="240" cy="180" r="190" fill="#5ed4c5" opacity=".11" filter="url(#blur)"/><circle cx="1380" cy="620" r="230" fill="#e5ad60" opacity=".12" filter="url(#blur)"/>
<text x="96" y="105" fill="#dceafa" font-family="sans-serif" font-size="29" letter-spacing="4">ELLIM · THOUGHTS</text><text x="96" y="170" fill="#fff" font-family="sans-serif" font-size="50" font-weight="700">기억은 목적과 경계를 가져야 한다</text>
<rect x="100" y="275" width="330" height="305" rx="24" fill="#123052" stroke="#68d9cc" stroke-width="2"/><text x="142" y="348" fill="#70dfd1" font-family="sans-serif" font-size="21" letter-spacing="2">FROM CONVERSATION</text><text x="142" y="416" fill="#fff" font-family="sans-serif" font-size="38" font-weight="700">대화의 정보</text><text x="142" y="472" fill="#bfd0e3" font-family="sans-serif" font-size="22">모두가 다음 판단에</text><text x="142" y="506" fill="#bfd0e3" font-family="sans-serif" font-size="22">필요한 것은 아니다</text>
<path d="M460 330 H565 M460 425 H565 M460 520 H565" stroke="#c9dbea" stroke-width="4"/><path d="M550 315 L580 330 L550 345 M550 410 L580 425 L550 440 M550 505 L580 520 L550 535" fill="none" stroke="#c9dbea" stroke-width="4"/>
<rect x="600" y="245" width="370" height="110" rx="20" fill="#27506b"/><text x="635" y="292" fill="#76e0d2" font-family="sans-serif" font-size="20" letter-spacing="2">KEEP · GENERALIZE</text><text x="635" y="332" fill="#fff" font-family="sans-serif" font-size="31" font-weight="700">반복되는 선호와 기준</text>
<rect x="600" y="390" width="370" height="110" rx="20" fill="#38516b"/><text x="635" y="437" fill="#f1ca87" font-family="sans-serif" font-size="20" letter-spacing="2">CHECK · EXPIRE</text><text x="635" y="477" fill="#fff" font-family="sans-serif" font-size="31" font-weight="700">현재 작업의 맥락</text>
<rect x="600" y="535" width="370" height="110" rx="20" fill="#302f4d"/><text x="635" y="582" fill="#d1b7e9" font-family="sans-serif" font-size="20" letter-spacing="2">DO NOT RETAIN</text><text x="635" y="622" fill="#fff" font-family="sans-serif" font-size="31" font-weight="700">원문과 불필요한 세부</text>
<path d="M1000 300 H1105 M1000 445 H1105" stroke="#aec4dc" stroke-width="4"/><path d="M1090 285 L1120 300 L1090 315 M1090 430 L1120 445 L1090 460" fill="none" stroke="#aec4dc" stroke-width="4"/>
<rect x="1145" y="275" width="355" height="300" rx="24" fill="#e8ba70"/><text x="1190" y="350" fill="#183552" font-family="sans-serif" font-size="20" letter-spacing="2">BEFORE NEXT USE</text><text x="1190" y="414" fill="#102944" font-family="sans-serif" font-size="35" font-weight="700">목적 · 범위 ·</text><text x="1190" y="460" fill="#102944" font-family="sans-serif" font-size="35" font-weight="700">만료를 확인</text><text x="1190" y="520" fill="#183552" font-family="sans-serif" font-size="21">현재 요청에 필요한가?</text>
<text x="100" y="744" fill="#c7d7e7" font-family="sans-serif" font-size="27">좋은 기억은 많이 남기는 능력이 아니라, 필요한 것만 안전하게 남기는 능력이다.</text>
</svg>