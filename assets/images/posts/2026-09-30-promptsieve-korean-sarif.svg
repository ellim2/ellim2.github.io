      <rect x="22" y="23" width="42" height="42" rx="10" fill="#22c7b8"/>
      <path d="m35 44 8 8 11-18" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#e8eefc"><rect x="85" y="27" width="148" height="9" rx="4" opacity="0.8"/><rect x="85" y="53" width="126" height="7" rx="3" opacity="0.38"/><rect x="22" y="96" width="214" height="8" rx="4" opacity="0.24"/><rect x="22" y="116" width="184" height="7" rx="3" opacity="0.16"/></g>
    </g>
    <g transform="translate(1082 623)">
      <rect width="274" height="142" rx="20" fill="#143f4a" stroke="#22c7b8" stroke-width="3"/>
      <rect x="22" y="23" width="42" height="42" rx="10" fill="#22c7b8"/>
      <path d="m35 44 8 8 11-18" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#e8eefc"><rect x="85" y="27" width="148" height="9" rx="4" opacity="0.8"/><rect x="85" y="53" width="96" height="7" rx="3" opacity="0.38"/><rect x="22" y="96" width="214" height="8" rx="4" opacity="0.24"/><rect x="22" y="116" width="138" height="7" rx="3" opacity="0.16"/></g>
    </g>
  </g>

  <!-- Neutral machine-readable report sheet -->
