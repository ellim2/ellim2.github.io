<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">한국어 규칙 검사와 구조화된 보고 흐름</title>
  <desc id="desc">짙은 남색 문서 흐름 속 산호색 경고 조각들이 정밀한 규칙 표시와 반투명 남보라색 검사 격자를 지나 청록색 결과 카드로 정리된 뒤 중립적인 보고서에 전달되는 추상 편집 일러스트레이션</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.58" stop-color="#121c35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554" stop-opacity="0.3"/>
      <stop offset="0.48" stop-color="#172554" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22c7b8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="scanner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6674d9" stop-opacity="0.46"/>
      <stop offset="0.5" stop-color="#172554" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#22c7b8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#cbd7ed"/>
    </linearGradient>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 14h28M14 0v28" stroke="#e8eefc" stroke-opacity="0.025" stroke-width="1"/>
      <path d="M0 0l28 28M28 0L0 28" stroke="#22c7b8" stroke-opacity="0.012" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0v52" fill="none" stroke="#e8eefc" stroke-opacity="0.2" stroke-width="2"/>
      <circle cx="0" cy="0" r="3" fill="#22c7b8" fill-opacity="0.7"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#050a14" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="scanClip"><rect x="672" y="137" width="330" height="626" rx="32"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1380" cy="120" r="330" fill="#172554" opacity="0.52"/>
  <circle cx="845" cy="474" r="410" fill="#172554" opacity="0.18"/>

