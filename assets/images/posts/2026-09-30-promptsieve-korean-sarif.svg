    <rect x="672" y="137" width="330" height="626" rx="32" fill="url(#scanner)" stroke="#8998ff" stroke-opacity="0.65" stroke-width="3"/>
    <rect x="672" y="137" width="330" height="626" rx="32" fill="url(#grid)"/>
    <path d="M693 283h288M693 450h288M693 617h288" stroke="#e8eefc" stroke-opacity="0.12" stroke-width="2"/>
    <g clip-path="url(#scanClip)">
