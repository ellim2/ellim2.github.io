  <path d="M-42 272c184-46 297-5 414 52 115 56 207 68 326 42" fill="none" stroke="#e8eefc" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M-35 538c166-32 276-14 404 38 116 47 205 55 330 20" fill="none" stroke="#22c7b8" stroke-opacity="0.25" stroke-width="3"/>

