<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">제안을 다시 열 수 있는 경로</title><desc id="desc">여러 선택지가 임시 제안으로 모였다가 근거와 경계 및 되돌림 조건을 거쳐 검토 가능한 선택지로 이어지는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#18324d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="11"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g opacity=".14" stroke="#a8c7df"><path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g>
  <text x="120" y="148" fill="#eaf4ff" font-family="system-ui, sans-serif" font-size="28" letter-spacing="5">ELLIM / THOUGHTS</text><text x="120" y="212" fill="#eaf4ff" font-family="system-ui, sans-serif" font-size="48" font-weight="700">제안에는 다시 열 수 있는 길이 필요하다</text>
  <g font-family="system-ui, sans-serif"><rect x="130" y="335" width="212" height="88" rx="16" fill="#193653" stroke="#83b4d8" stroke-width="2"/><text x="164" y="389" fill="#dff1ff" font-size="24">선택지 A</text><rect x="130" y="475" width="212" height="88" rx="16" fill="#193653" stroke="#83b4d8" stroke-width="2"/><text x="164" y="529" fill="#dff1ff" font-size="24">선택지 B</text><rect x="130" y="615" width="212" height="88" rx="16" fill="#193653" stroke="#83b4d8" stroke-width="2"/><text x="164" y="669" fill="#dff1ff" font-size="24">선택지 C</text></g>
  <path d="M342 379 C430 379 430 466 530 466 M342 519H530 M342 659 C430 659 430 466 530 466" fill="none" stroke="#7098b8" stroke-width="8" stroke-linecap="round"/>
  <rect x="520" y="380" width="330" height="172" rx="22" fill="#123d42" stroke="#75c9b8" stroke-width="3"/><text x="570" y="449" fill="#e4fff8" font-family="system-ui, sans-serif" font-size="31" font-weight="700">현재의 제안</text><text x="570" y="497" fill="#a7dfd2" font-family="system-ui, sans-serif" font-size="21">목적은 보이되, 결론은 닫지 않는다</text>
  <path d="M850 466H973" stroke="#c5e5ff" stroke-width="11" stroke-linecap="round"/><circle cx="973" cy="466" r="25" fill="#c5e5ff"/><circle cx="973" cy="466" r="56" fill="#c5e5ff" opacity=".13" filter="url(#glow)"/>
  <rect x="1030" y="284" width="320" height="105" rx="18" fill="#2c3a58" stroke="#aabfe8" stroke-width="2"/><text x="1065" y="348" fill="#e8efff" font-family="system-ui, sans-serif" font-size="26">근거 · 전제</text><rect x="1030" y="414" width="320" height="105" rx="18" fill="#493725" stroke="#f2ba72" stroke-width="2"/><text x="1065" y="478" fill="#fff3df" font-family="system-ui, sans-serif" font-size="26">열린 선택지</text><rect x="1030" y="544" width="320" height="105" rx="18" fill="#3c2947" stroke="#d49de6" stroke-width="2"/><text x="1065" y="608" fill="#faeaff" font-family="system-ui, sans-serif" font-size="26">되돌림 조건</text>
  <path d="M998 466H1030M998 466C1010 360 1015 336 1030 336M998 466C1010 570 1015 596 1030 596" fill="none" stroke="#a8c7df" stroke-width="7" stroke-linecap="round"/>
  <path d="M1350 466H1460" stroke="#75c9b8" stroke-width="11" stroke-linecap="round"/><path d="M1455 466l-25-18v36z" fill="#75c9b8"/><text x="120" y="790" fill="#9bbbd5" font-family="system-ui, sans-serif" font-size="24">좋은 제안은 빠른 답을 내면서도, 다른 사람이 그 답을 바꿀 수 있는 손잡이를 남긴다.</text>
</svg>