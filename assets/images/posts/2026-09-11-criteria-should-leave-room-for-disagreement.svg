<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">판단 기준과 이견을 다룰 자리</title><desc id="desc">하나의 판단 기준이 일관된 실행과 예외 검토로 이어지고, 설명 가능한 결정으로 모이는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162c"/><stop offset="1" stop-color="#1c3152"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="13"/></filter></defs>
  <rect width="1600" height="840" fill="url(#bg)"/><circle cx="255" cy="225" r="185" fill="#45d0c0" opacity=".12" filter="url(#glow)"/><circle cx="1350" cy="590" r="230" fill="#ecae5a" opacity=".12" filter="url(#glow)"/>
  <text x="100" y="110" fill="#dceafa" font-family="sans-serif" font-size="30" letter-spacing="4">ELLIM · THOUGHTS</text><text x="100" y="172" fill="#fff" font-family="sans-serif" font-size="52" font-weight="700">기준은 이견의 자리를 남겨야 한다</text>
  <rect x="100" y="285" width="340" height="275" rx="24" fill="#123052" stroke="#67d8ca" stroke-width="2"/><text x="145" y="363" fill="#67d8ca" font-family="sans-serif" font-size="24" letter-spacing="3">STARTING POINT</text><text x="145" y="432" fill="#fff" font-family="sans-serif" font-size="43" font-weight="700">판단 기준</text><text x="145" y="486" fill="#bfd0e3" font-family="sans-serif" font-size="23">반복을 줄이는 질문</text>
  <path d="M470 365 H590" stroke="#dbeafa" stroke-width="4"/><path d="M575 350 L605 365 L575 380" fill="none" stroke="#dbeafa" stroke-width="4"/><path d="M470 480 H590" stroke="#dbeafa" stroke-width="4"/><path d="M575 465 L605 480 L575 495" fill="none" stroke="#dbeafa" stroke-width="4"/>
  <rect x="625" y="260" width="380" height="145" rx="22" fill="#234465"/><text x="665" y="315" fill="#77dcd0" font-family="sans-serif" font-size="22" letter-spacing="2">DEFAULT PATH</text><text x="665" y="365" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">일관된 실행</text>
  <rect x="625" y="445" width="380" height="145" rx="22" fill="#234465"/><text x="665" y="500" fill="#f4c77d" font-family="sans-serif" font-size="22" letter-spacing="2">WHEN FACTS DIFFER</text><text x="665" y="550" fill="#fff" font-family="sans-serif" font-size="34" font-weight="700">예외를 검토</text>
  <path d="M1035 332 H1140 M1035 517 H1140" stroke="#a8c0d8" stroke-width="4"/><path d="M1125 317 L1155 332 L1125 347 M1125 502 L1155 517 L1125 532" fill="none" stroke="#a8c0d8" stroke-width="4"/>
  <rect x="1175" y="285" width="325" height="275" rx="24" fill="#e8ba70"/><text x="1218" y="365" fill="#1a3554" font-family="sans-serif" font-size="22" letter-spacing="2">SHARED SURFACE</text><text x="1218" y="430" fill="#102944" font-family="sans-serif" font-size="37" font-weight="700">설명 가능한</text><text x="1218" y="478" fill="#102944" font-family="sans-serif" font-size="37" font-weight="700">결정</text><text x="1218" y="523" fill="#1a3554" font-family="sans-serif" font-size="21">기준 · 관찰 · 예외</text>
  <text x="100" y="745" fill="#c1d1e2" font-family="sans-serif" font-size="27">좋은 기준은 답을 대신하지 않고, 반례를 검토할 수 있게 한다.</text>
</svg>