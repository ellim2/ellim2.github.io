<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">성공 신호와 검증의 거리</title><desc id="desc">짙은 남색 바탕에서 자동화된 성공 신호가 관찰 가능한 결과와 독립적인 확인을 거쳐 신뢰 가능한 판단으로 이어지는 가로형 도해</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b34"/><stop offset="1" stop-color="#182a4a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#050a14" flood-opacity=".35"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><path d="M0 690C260 585 365 760 650 660s438-220 950-68V900H0Z" fill="#0d162b" opacity=".68"/>
<text x="112" y="150" fill="#9db2d0" font-family="system-ui, sans-serif" font-size="30" letter-spacing="5">AUTOMATION IS A SIGNAL, NOT A VERDICT</text>
<g filter="url(#shadow)"><rect x="112" y="275" width="356" height="260" rx="26" fill="#243858" stroke="#4e6b94" stroke-width="2"/><rect x="622" y="275" width="356" height="260" rx="26" fill="#213d50" stroke="#4d8790" stroke-width="2"/><rect x="1132" y="275" width="356" height="260" rx="26" fill="#274549" stroke="#6db5a4" stroke-width="2"/></g>
<circle cx="178" cy="348" r="30" fill="#f2bf64"/><path d="M165 348l10 11 20-25" fill="none" stroke="#17223a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="358" fill="#f5f7fb" font-family="system-ui, sans-serif" font-size="34" font-weight="700">성공 신호</text><text x="160" y="432" fill="#b8c6da" font-family="system-ui, sans-serif" font-size="27">명령은 끝났다</text><text x="160" y="475" fill="#b8c6da" font-family="system-ui, sans-serif" font-size="27">그러나 결과는 미확정</text>
<circle cx="688" cy="348" r="30" fill="#78c4c0"/><path d="M676 349h25m-13-13v26" fill="none" stroke="#14293a" stroke-width="7" stroke-linecap="round"/><text x="735" y="358" fill="#f5f7fb" font-family="system-ui, sans-serif" font-size="34" font-weight="700">관찰 가능한 결과</text><text x="670" y="432" fill="#b8c6da" font-family="system-ui, sans-serif" font-size="27">생성물·상태·범위</text><text x="670" y="475" fill="#b8c6da" font-family="system-ui, sans-serif" font-size="27">직접 다시 확인</text>
<circle cx="1198" cy="348" r="30" fill="#8bdbb3"/><path d="M1185 348l10 11 20-25" fill="none" stroke="#163639" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1245" y="358" fill="#f5f7fb" font-family="system-ui, sans-serif" font-size="34" font-weight="700">책임 있는 판단</text><text x="1180" y="432" fill="#c4d9da" font-family="system-ui, sans-serif" font-size="27">확인 범위와 한계</text><text x="1180" y="475" fill="#c4d9da" font-family="system-ui, sans-serif" font-size="27">함께 남기기</text>
<path d="M488 405h95" stroke="#f2bf64" stroke-width="6" stroke-linecap="round"/><path d="M575 390l25 15-25 15" fill="none" stroke="#f2bf64" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M998 405h95" stroke="#78c4c0" stroke-width="6" stroke-linecap="round"/><path d="M1085 390l25 15-25 15" fill="none" stroke="#78c4c0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112" y="720" fill="#e6edf7" font-family="system-ui, sans-serif" font-size="45" font-weight="700">성공이라는 말은, 확인을 생략할 근거가 아니다.</text><text x="114" y="782" fill="#9db2d0" font-family="system-ui, sans-serif" font-size="29">출력의 문장보다 바깥의 상태를 다시 보는 일이 신뢰를 만든다.</text>
</svg>