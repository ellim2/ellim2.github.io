<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A large folded sheet becoming smaller inspectable panels</title>
  <desc id="desc">A restrained dark editorial illustration in which a warm folded sheet separates into movable panels under a bright inspection lens, with subtle human-scale marks nearby suggesting collaborative oversight and safe redirection.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="70" x2="1480" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172331"/>
      <stop offset="0.52" stop-color="#0d1723"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <radialGradient id="lightPool" cx="0" cy="0" r="1" gradientTransform="translate(1105 386) rotate(147) scale(510 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9ddf1" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#5f91b0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#193149" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperMain" x1="294" y1="197" x2="876" y2="692" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eadfc7"/>
      <stop offset="0.55" stop-color="#cbbda4"/>
      <stop offset="1" stop-color="#8f887b"/>
    </linearGradient>
    <linearGradient id="paperFold" x1="560" y1="238" x2="791" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5ead0"/>
      <stop offset="0.45" stop-color="#b6aa93"/>
      <stop offset="1" stop-color="#736f68"/>
    </linearGradient>
    <linearGradient id="panelWarm" x1="880" y1="300" x2="1234" y2="705" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7dbc0"/>
      <stop offset="1" stop-color="#9e9688"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="950" y1="260" x2="1310" y2="714" gradientUnits="userSpaceOnUse">
      <stop stop-color="#789bb2"/>
      <stop offset="1" stop-color="#314e64"/>
    </linearGradient>
    <linearGradient id="lensRim" x1="978" y1="247" x2="1298" y2="572" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2f4f5"/>
      <stop offset="0.34" stop-color="#8dbbd0"/>
      <stop offset="0.72" stop-color="#426c88"/>
      <stop offset="1" stop-color="#1c3449"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="0" cy="0" r="1" gradientTransform="translate(1081 349) rotate(55) scale(162)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8f0d8" stop-opacity="0.94"/>
      <stop offset="0.32" stop-color="#bce1ea" stop-opacity="0.68"/>
      <stop offset="0.72" stop-color="#507b98" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#152c40" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#02070c" flood-opacity="0.55"/>
    </filter>
    <filter id="panelShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="3" dy="18" stdDeviation="12" flood-color="#02070c" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="17" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="lensClip">
      <circle cx="1092" cy="376" r="126"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <ellipse cx="1014" cy="436" rx="535" ry="390" fill="url(#lightPool)"/>

  <g opacity="0.5" fill="none" stroke="#416077" stroke-width="2">
    <path d="M128 711C314 790 493 803 664 780"/>
    <path d="M1258 173C1371 224 1458 308 1502 410" opacity="0.35"/>
    <path d="M111 663C161 680 206 683 247 674" opacity="0.38"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M260 240L557 173L842 256L863 612L589 720L292 631Z" fill="url(#paperMain)"/>
    <path d="M260 240L557 173L569 568L292 631Z" fill="#d8cbb2"/>
    <path d="M557 173L842 256L784 453L569 568Z" fill="url(#paperFold)"/>
    <path d="M569 568L784 453L863 612L589 720Z" fill="#a69d8d"/>
    <path d="M557 173L569 568" fill="none" stroke="#837d72" stroke-width="3" opacity="0.7"/>
    <path d="M569 568L292 631" fill="none" stroke="#f6ead0" stroke-width="2" opacity="0.42"/>
    <path d="M569 568L784 453" fill="none" stroke="#5c6261" stroke-width="3" opacity="0.58"/>
    <path d="M784 453L842 256" fill="none" stroke="#f1e5ca" stroke-width="2" opacity="0.38"/>
    <path d="M260 240L557 173L842 256" fill="none" stroke="#fff4d9" stroke-width="4" opacity="0.32"/>
  </g>

  <path d="M826 286C870 308 897 340 910 379" fill="none" stroke="#87a9bc" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15" opacity="0.6"/>
  <path d="M852 494C889 507 916 534 928 565" fill="none" stroke="#87a9bc" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15" opacity="0.5"/>
  <path d="M826 620C862 621 891 611 913 590" fill="none" stroke="#87a9bc" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15" opacity="0.46"/>

  <g filter="url(#panelShadow)">
    <path d="M886 277L1030 243L1061 370L918 410Z" fill="url(#panelWarm)"/>
    <path d="M910 432L1058 395L1095 522L943 566Z" fill="url(#panelBlue)"/>
    <path d="M944 587L1088 542L1126 674L979 722Z" fill="url(#panelWarm)"/>
    <path d="M1112 540L1240 510L1273 628L1143 662Z" fill="#55778e"/>
    <path d="M1229 321L1351 341L1332 458L1209 438Z" fill="#b6ad9c"/>
    <path d="M886 277L1030 243" stroke="#fff0d2" stroke-width="3" opacity="0.45"/>
    <path d="M944 587L1088 542" stroke="#fff0d2" stroke-width="3" opacity="0.38"/>
  </g>

  <circle cx="1092" cy="376" r="162" fill="#9bdbef" opacity="0.16" filter="url(#glow)"/>
  <g transform="rotate(-11 1092 376)" filter="url(#panelShadow)">
    <circle cx="1092" cy="376" r="143" fill="none" stroke="#07111c" stroke-width="28" opacity="0.72"/>
    <circle cx="1092" cy="376" r="139" fill="none" stroke="url(#lensRim)" stroke-width="17"/>
    <circle cx="1092" cy="376" r="126" fill="url(#lensGlass)"/>
    <g clip-path="url(#lensClip)">
      <path d="M902 425L1057 387L1094 521L939 560Z" fill="#86a9bd" opacity="0.72"/>
      <path d="M886 277L1030 243L1061 370L918 410Z" fill="#f1e2c2" opacity="0.88"/>
      <path d="M975 269L1011 407" fill="none" stroke="#fff7df" stroke-width="5" opacity="0.48"/>
      <path d="M954 445L1082 413" fill="none" stroke="#d9edf0" stroke-width="4" opacity="0.5"/>
    </g>
    <path d="M1198 476L1317 602" fill="none" stroke="#172b3c" stroke-width="42" stroke-linecap="round"/>
    <path d="M1198 476L1317 602" fill="none" stroke="#5d8095" stroke-width="27" stroke-linecap="round"/>
    <path d="M1210 490L1307 593" fill="none" stroke="#9ab6c4" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <path d="M1007 288A126 126 0 0 1 1153 266" fill="none" stroke="#f4fcf4" stroke-width="9" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g opacity="0.76">
    <ellipse cx="392" cy="758" rx="13" ry="7" fill="#718b9a" transform="rotate(-12 392 758)"/>
    <ellipse cx="426" cy="747" rx="8" ry="5" fill="#d3c6aa" transform="rotate(18 426 747)"/>
    <path d="M376 778C396 787 418 784 435 770" fill="none" stroke="#55768a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="1394" cy="566" rx="11" ry="6" fill="#7591a2" transform="rotate(21 1394 566)"/>
    <ellipse cx="1425" cy="579" rx="7" ry="5" fill="#c2b69f" transform="rotate(-13 1425 579)"/>
    <path d="M1377 584C1391 600 1414 605 1436 598" fill="none" stroke="#55768a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="1204" cy="753" rx="10" ry="6" fill="#c7baa0" transform="rotate(-26 1204 753)"/>
    <ellipse cx="1234" cy="744" rx="7" ry="4" fill="#708b9c" transform="rotate(11 1234 744)"/>
  </g>

  <g fill="none" stroke="#87a9bc" stroke-linecap="round" opacity="0.52">
    <path d="M1287 702C1331 685 1367 653 1385 614" stroke-width="3"/>
    <path d="M1374 625L1387 610L1392 630" stroke-width="3"/>
    <path d="M724 764C801 755 855 730 897 687" stroke-width="3"/>
    <path d="M878 693L900 683L894 705" stroke-width="3"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.7"/>
</svg>
