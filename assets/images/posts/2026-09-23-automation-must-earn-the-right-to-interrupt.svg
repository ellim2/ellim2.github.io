<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="자동 실행이 확인, 위험, 사람의 선택을 거쳐 주의 요청의 자격을 검토하는 도해">
<rect width="1600" height="900" fill="#0b1220"/><circle cx="1330" cy="130" r="260" fill="#3979d9" opacity=".12"/>
<text x="120" y="135" fill="#8fa4c5" font-size="25" font-family="Arial, sans-serif" letter-spacing="7">AUTOMATION &amp; ATTENTION</text>
<text x="120" y="225" fill="#f4f7fb" font-size="62" font-family="Arial, sans-serif">주의를 요청하기 전에</text>
<text x="120" y="300" fill="#f4f7fb" font-size="62" font-family="Arial, sans-serif">자동화가 먼저 확인할 것</text>
<text x="120" y="365" fill="#b9cbe5" font-size="25" font-family="Arial, sans-serif">조용함이 아니라, 필요한 판단을 정확히 호출하는 설계</text>
<line x1="145" y1="480" x2="1455" y2="480" stroke="#263c60" stroke-width="18" stroke-linecap="round"/><line x1="145" y1="480" x2="1120" y2="480" stroke="#69a5ff" stroke-width="18" stroke-linecap="round"/>
<g font-family="Arial, sans-serif"><rect x="120" y="560" width="340" height="155" rx="22" fill="#142847" stroke="#4d6e9e" stroke-width="2"/><text x="155" y="620" fill="#b9cbe5" font-size="23">1. 확인</text><text x="155" y="670" fill="#f4f7fb" font-size="32">스스로 읽을 수 있는가</text>
<rect x="630" y="560" width="340" height="155" rx="22" fill="#142847" stroke="#4d6e9e" stroke-width="2"/><text x="665" y="620" fill="#b9cbe5" font-size="23">2. 영향</text><text x="665" y="670" fill="#f4f7fb" font-size="32">되돌릴 수 있는가</text>
<rect x="1140" y="560" width="340" height="155" rx="22" fill="#18343c" stroke="#69a5ff" stroke-width="3"/><text x="1175" y="620" fill="#a7d8ff" font-size="23">3. 선택</text><text x="1175" y="670" fill="#f4f7fb" font-size="32">사람의 판단이 필요한가</text></g>
<circle cx="545" cy="480" r="13" fill="#69a5ff"/><circle cx="1055" cy="480" r="13" fill="#69a5ff"/><text x="120" y="815" fill="#8fa4c5" font-size="21" font-family="Arial, sans-serif">ASK ONLY WHEN THE DECISION CHANGES THE OUTCOME</text></svg>
