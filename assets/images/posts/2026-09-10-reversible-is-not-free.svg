<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">되돌릴 수 있는 실행과 남는 비용</title><desc id="desc">실행이 기술적 되돌림, 정보 잔여성, 협업 재진입, 검증 비용으로 이어지고 실행 전 경계 확인으로 연결되는 도해</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08162e"/><stop offset="1" stop-color="#152847"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs>
  <rect width="1600" height="840" fill="url(#bg)"/><circle cx="260" cy="420" r="190" fill="#33c7be" opacity=".12" filter="url(#glow)"/><circle cx="1300" cy="390" r="220" fill="#e8aa56" opacity=".10" filter="url(#glow)"/>
  <text x="100" y="110" fill="#e9f1fb" font-family="sans-serif" font-size="30" letter-spacing="4">ELLIM · THOUGHTS</text><text x="100" y="172" fill="#fff" font-family="sans-serif" font-size="54" font-weight="700">되돌림은 복구 명령보다 넓다</text>
  <rect x="100" y="285" width="300" height="280" rx="22" fill="#112b4b" stroke="#61d6ca" stroke-width="2"/><text x="140" y="365" fill="#61d6ca" font-family="sans-serif" font-size="25" letter-spacing="3">ACTION</text><text x="140" y="430" fill="#fff" font-family="sans-serif" font-size="42" font-weight="700">실행</text><text x="140" y="480" fill="#b8c7d9" font-family="sans-serif" font-size="24">되돌릴 수 있다?</text>
  <path d="M430 425 H555" stroke="#dbe9f8" stroke-width="4"/><path d="M540 410 L570 425 L540 440" fill="none" stroke="#dbe9f8" stroke-width="4"/>
  <rect x="590" y="230" width="350" height="105" rx="18" fill="#203c5d"/><text x="630" y="275" fill="#f7c77a" font-family="sans-serif" font-size="23">기술적 복구</text><text x="630" y="310" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">파일 · 설정 · 배포</text>
  <rect x="590" y="365" width="350" height="105" rx="18" fill="#203c5d"/><text x="630" y="410" fill="#f7c77a" font-family="sans-serif" font-size="23">정보의 잔여성</text><text x="630" y="445" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">이미 보인 결과</text>
  <rect x="590" y="500" width="350" height="105" rx="18" fill="#203c5d"/><text x="630" y="545" fill="#f7c77a" font-family="sans-serif" font-size="23">협업 · 검증 비용</text><text x="630" y="580" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">다시 알리고 확인할 일</text>
  <path d="M970 285 H1075 M970 420 H1075 M970 555 H1075" stroke="#89a8c8" stroke-width="3"/><path d="M1060 270 L1090 285 L1060 300 M1060 405 L1090 420 L1060 435 M1060 540 L1090 555 L1060 570" fill="none" stroke="#89a8c8" stroke-width="3"/>
  <rect x="1110" y="285" width="370" height="280" rx="22" fill="#e7b96d"/><text x="1150" y="365" fill="#17304e" font-family="sans-serif" font-size="25" letter-spacing="3">BEFORE EXECUTION</text><text x="1150" y="432" fill="#09203b" font-family="sans-serif" font-size="38" font-weight="700">경계를 확인한다</text><text x="1150" y="485" fill="#17304e" font-family="sans-serif" font-size="23">누구에게 보이는가 · 무엇이 바뀌는가</text>
  <text x="100" y="745" fill="#b8c7d9" font-family="sans-serif" font-size="28">복구 가능성은 실행의 근거가 될 수 있지만, 검토 생략의 면허는 아니다.</text>
</svg>
