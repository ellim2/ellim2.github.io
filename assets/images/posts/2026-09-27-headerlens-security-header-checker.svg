  <g clip-path="url(#lensClip)">
    <circle cx="1010" cy="455" r="208" fill="#172A3C"/>
    <path d="M790 320H1230M790 590H1230" stroke="#F2B84B" stroke-width="2" opacity="0.35"/>
    <g fill="#203A50">
