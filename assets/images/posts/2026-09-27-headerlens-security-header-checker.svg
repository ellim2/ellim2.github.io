<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">헤더렌즈 보안 헤더 로컬 점검</title>
  <desc id="desc">짙은 남색 배경 위 추상 브라우저 응답 카드에 확대경이 놓여 있고, 확대된 보안 헤더 행과 초록색 방패 확인 표시, 누락을 뜻하는 붉은색과 호박색 표식이 보이는 기술 일러스트레이션</desc>

  <defs>
    <clipPath id="lensClip">
      <circle cx="1010" cy="455" r="208"/>
    </clipPath>
    <pattern id="dotGrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#2A405E"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#071321"/>
  <rect x="42" y="42" width="1516" height="816" rx="36" fill="#0A192B" stroke="#1A314B" stroke-width="2"/>
  <path d="M42 214H1558M1240 42V214" fill="none" stroke="#142A43" stroke-width="2"/>
  <rect x="70" y="240" width="1460" height="590" fill="url(#dotGrid)" opacity="0.35"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="96" y="108" fill="#F2B84B" font-size="22" font-weight="700" letter-spacing="5">HEADERLENS</text>
    <text x="96" y="166" fill="#F5F7FA" font-size="42" font-weight="700" letter-spacing="-1">LOCAL HEADER CHECK</text>
    <rect x="1288" y="91" width="174" height="54" rx="27" fill="#10263B" stroke="#294762" stroke-width="2"/>
    <circle cx="1324" cy="118" r="7" fill="#54B985"/>
    <text x="1347" y="126" fill="#AFC2D4" font-size="18" letter-spacing="2">LOCAL</text>
  </g>

  <!-- Abstract browser response card -->
  <g>
    <rect x="170" y="290" width="870" height="450" rx="26" fill="#0D2136" stroke="#35516D" stroke-width="3"/>
    <path d="M170 364H1040" stroke="#35516D" stroke-width="3"/>
    <circle cx="214" cy="327" r="8" fill="#D65F5F"/>
    <circle cx="242" cy="327" r="8" fill="#E6AA45"/>
    <circle cx="270" cy="327" r="8" fill="#4FA878"/>
    <rect x="316" y="310" width="434" height="34" rx="17" fill="#122B43"/>
    <path d="M338 327H616" stroke="#45617B" stroke-width="5" stroke-linecap="round"/>
    <rect x="928" y="310" width="68" height="34" rx="17" fill="#142F48"/>
    <path d="M951 327H973" stroke="#6A8399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Header rows outside the lens -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="222" y="412" fill="#7890A6" font-size="15" letter-spacing="3">RESPONSE HEADERS</text>
    <g fill="#102940">
      <rect x="214" y="438" width="750" height="52" rx="10"/>
      <rect x="214" y="504" width="750" height="52" rx="10"/>
      <rect x="214" y="570" width="750" height="52" rx="10"/>
      <rect x="214" y="636" width="750" height="52" rx="10"/>
    </g>
    <g fill="#678199" font-size="17" font-weight="700" letter-spacing="2">
      <text x="246" y="471">CSP</text>
      <text x="246" y="537">HSTS</text>
      <text x="246" y="603">REFERRER</text>
      <text x="246" y="669">NOSNIFF</text>
    </g>
    <g stroke="#304A63" stroke-width="5" stroke-linecap="round">
      <path d="M410 464H764"/>
      <path d="M410 530H704"/>
      <path d="M410 596H804"/>
      <path d="M410 662H738"/>
    </g>
    <circle cx="918" cy="464" r="10" fill="#4FA878"/>
    <circle cx="918" cy="530" r="10" fill="#D65F5F"/>
    <circle cx="918" cy="596" r="10" fill="#E6AA45"/>
    <circle cx="918" cy="662" r="10" fill="#4FA878"/>
  </g>

