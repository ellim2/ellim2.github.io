      <rect x="806" y="401" width="420" height="62" rx="12"/>
      <rect x="806" y="475" width="420" height="62" rx="12"/>
      <rect x="806" y="549" width="420" height="62" rx="12"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" letter-spacing="2">
      <text x="844" y="366" fill="#EAF1F6">CSP</text>
      <text x="844" y="440" fill="#EAF1F6">HSTS</text>
      <text x="844" y="514" fill="#EAF1F6">REFERRER</text>
      <text x="844" y="588" fill="#EAF1F6">NOSNIFF</text>
    </g>
    <g stroke="#7891A8" stroke-width="6" stroke-linecap="round">
      <path d="M1010 358H1132"/>
      <path d="M1010 432H1100"/>
      <path d="M1010 506H1160"/>
      <path d="M1010 580H1118"/>
    </g>
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1173 357l10 10 21-24" stroke="#67C992"/>
      <path d="M1175 421l22 22m0-22-22 22" stroke="#F06A6A"/>
      <path d="M1186 491v18m0 9v1" stroke="#F2B84B"/>
      <path d="M1173 579l10 10 21-24" stroke="#67C992"/>
    </g>
  </g>

  <!-- Magnifying lens rim and handle -->
  <circle cx="1010" cy="455" r="218" fill="none" stroke="#F2B84B" stroke-width="18"/>
  <circle cx="1010" cy="455" r="232" fill="none" stroke="#FFD47A" stroke-width="3" opacity="0.7"/>
  <path d="M1170 612L1329 771" stroke="#071321" stroke-width="60" stroke-linecap="round"/>
  <path d="M1170 612L1329 771" stroke="#F2B84B" stroke-width="38" stroke-linecap="round"/>
  <path d="M1192 632L1316 756" stroke="#FFD47A" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

  <!-- Shield confirmation -->
  <g transform="translate(1290 312)">
    <path d="M0 0l86 29v70c0 65-39 111-86 133-47-22-86-68-86-133V29L0 0z" fill="#0F2D2B" stroke="#5CC58C" stroke-width="5"/>
    <path d="M-36 105l25 25 51-62" fill="none" stroke="#72D69D" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="7" fill="#72D69D"/>
  </g>

  <!-- Restrained status key -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">
    <rect x="1226" y="612" width="274" height="92" rx="18" fill="#0D2136" stroke="#294762" stroke-width="2"/>
    <circle cx="1260" cy="645" r="7" fill="#D65F5F"/>
    <text x="1280" y="651" fill="#AFC2D4">MISSING</text>
    <circle cx="1260" cy="676" r="7" fill="#E6AA45"/>
    <text x="1280" y="682" fill="#AFC2D4">REVIEW</text>
  </g>

  <path d="M96 794H1132" stroke="#1D354E" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="96" y="827" fill="#7D93A8" font-size="16" letter-spacing="3">INSPECT · VERIFY · KEEP IT LOCAL</text>
    <text x="1494" y="827" fill="#3F5A72" font-size="16" text-anchor="end">09 / 27</text>
  </g>
</svg>
