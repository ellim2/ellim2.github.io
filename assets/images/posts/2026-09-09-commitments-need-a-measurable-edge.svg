<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">약속의 확인 가능한 가장자리</title>
<desc id="desc">넓은 약속이 관찰 가능한 결과, 적용 범위, 남은 확인으로 분리되어 다음 판단으로 이어지는 도해</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172e"/><stop offset="1" stop-color="#283560"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2ca78"/><stop offset="1" stop-color="#9bd8d2"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020614" flood-opacity=".42"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1425" cy="130" r="280" fill="#875b9d" opacity=".25"/><circle cx="120" cy="810" r="280" fill="#147885" opacity=".2"/>
<text x="116" y="122" fill="#c7d6eb" font-size="25" font-family="Arial, sans-serif" letter-spacing="5">THOUGHTS / COMMITMENT</text>
<text x="116" y="204" fill="#fff9ef" font-size="58" font-weight="700" font-family="Arial, sans-serif">약속에는 확인 가능한 가장자리가 필요하다</text>
<g filter="url(#shadow)"><rect x="116" y="318" width="1368" height="130" rx="28" fill="#e9b77f"/></g>
<text x="166" y="372" fill="#172943" font-size="23" font-family="Arial, sans-serif" letter-spacing="3">BROAD COMMITMENT</text>
<text x="166" y="421" fill="#172943" font-size="42" font-weight="700" font-family="Arial, sans-serif">완료하겠습니다</text>
<path d="M800 470v64m0 0-28-30m28 30 28-30" stroke="url(#beam)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g filter="url(#shadow)"><rect x="116" y="574" width="390" height="190" rx="26" fill="#f2ce83"/><rect x="605" y="574" width="390" height="190" rx="26" fill="#a7d9d1"/><rect x="1094" y="574" width="390" height="190" rx="26" fill="#e9afc0"/></g>
<text x="156" y="626" fill="#1b2b43" font-size="21" font-family="Arial, sans-serif" letter-spacing="3">OBSERVABLE RESULT</text>
<text x="156" y="688" fill="#1b2b43" font-size="38" font-weight="700" font-family="Arial, sans-serif">무엇을 확인했나</text>
<text x="645" y="626" fill="#1b2b43" font-size="21" font-family="Arial, sans-serif" letter-spacing="3">SCOPE</text>
<text x="645" y="688" fill="#1b2b43" font-size="38" font-weight="700" font-family="Arial, sans-serif">어디까지 바뀌나</text>
<text x="1134" y="626" fill="#1b2b43" font-size="21" font-family="Arial, sans-serif" letter-spacing="3">OPEN CHECK</text>
<text x="1134" y="688" fill="#1b2b43" font-size="38" font-weight="700" font-family="Arial, sans-serif">무엇이 남았나</text>
<text x="116" y="842" fill="#d9e3f2" font-size="32" font-family="Arial, sans-serif">큰 완료의 말보다, 다음 사람이 확인할 수 있는 상태를 먼저 남긴다.</text>
</svg>
