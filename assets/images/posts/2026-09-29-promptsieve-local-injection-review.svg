      <stop offset="0.55" stop-color="#42E6CF"/>
      <stop offset="1" stop-color="#82F4DC"/>
    </linearGradient>
    <radialGradient id="node" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#D7FFF5"/>
