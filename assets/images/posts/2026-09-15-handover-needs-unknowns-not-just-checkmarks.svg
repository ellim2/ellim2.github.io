<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">인수인계에서 확인된 사실과 열린 질문을 구분하는 구조</title>
  <desc id="desc">완료된 항목, 확인이 필요한 질문, 다음 판단의 담당이 세 개의 편집 칸으로 나뉘어 다음 작업으로 이어진다.</desc>
  <rect width="1600" height="900" fill="#0b1220"/>
  <path d="M0 170H1600M0 730H1600" stroke="#243247" stroke-width="2"/>
  <text x="112" y="145" fill="#b8c6d9" font-family="sans-serif" font-size="26" letter-spacing="5">HANDOVER NOTE / 01</text>
  <text x="112" y="235" fill="#f4f0e7" font-family="serif" font-size="62">다음 판단을 위한 기록</text>
  <text x="116" y="285" fill="#91a2b7" font-family="sans-serif" font-size="26">체크 표시와 아직 열려 있는 경계를 같은 문서에 남긴다.</text>
  <g transform="translate(112 365)">
    <rect width="382" height="250" rx="4" fill="#132036" stroke="#36506f" stroke-width="2"/>
    <rect x="28" y="30" width="22" height="22" fill="#d8aa48"/>
    <text x="70" y="49" fill="#f4f0e7" font-family="sans-serif" font-size="27" font-weight="700">확인된 사실</text>
    <path d="M30 102h318M30 151h250M30 200h292" stroke="#7991ad" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 102l10 10 20-25M30 151l10 10 20-25M30 200l10 10 20-25" fill="none" stroke="#d8aa48" stroke-width="4"/>
  </g>
  <g transform="translate(610 365)">
    <rect width="382" height="250" rx="4" fill="#16253b" stroke="#55708f" stroke-width="2"/>
    <circle cx="40" cy="41" r="13" fill="none" stroke="#e6bf65" stroke-width="4"/>
    <text x="70" y="49" fill="#f4f0e7" font-family="sans-serif" font-size="27" font-weight="700">열린 질문</text>
    <path d="M30 102h290M30 151h246M30 200h314" stroke="#8299b3" stroke-width="8" stroke-linecap="round"/>
    <text x="335" y="210" fill="#e6bf65" font-family="serif" font-size="60">?</text>
  </g>
  <g transform="translate(1108 365)">
    <rect width="382" height="250" rx="4" fill="#1a2940" stroke="#67809d" stroke-width="2"/>
    <path d="M30 43h22l12 14-12 14H30z" fill="#d8aa48"/>
    <text x="78" y="49" fill="#f4f0e7" font-family="sans-serif" font-size="27" font-weight="700">다음 판단</text>
    <path d="M30 102h260M30 151h308M30 200h208" stroke="#95abc2" stroke-width="8" stroke-linecap="round"/>
    <path d="M315 185l34 15-34 15z" fill="#d8aa48"/>
  </g>
  <path d="M494 490h86M992 490h86" stroke="#d8aa48" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="112" y="790" fill="#d8aa48" font-family="sans-serif" font-size="25" letter-spacing="2">FACTS / UNKNOWNS / DECISION CONDITIONS</text>
  <text x="112" y="835" fill="#91a2b7" font-family="sans-serif" font-size="25">기록은 자신감을 복사하지 않고, 다음 사람이 판단할 자리를 만든다.</text>
</svg>